<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <title>MindStore</title>
</head>

<body>
  <!--  서비스 이름: MindStore
        주요 사용자: 생각이 많아 정리가 안되는 사람
        목적: 메모를 작성하고 정리를 통해 생각정리를 도와준다.
        핵심 행동: 메모 기록하고 각 메모당 순위 및 중요도를 정한다.
        정보 순서: 소개 → 주요 기능 → 이용 방법 -> 메모 리스트 → 메모 작성 -> 메모 정리  -->

  <header>
    <h1>생각정리 서비스</h1>
    <p>생각정리를 위한 메모 작성, 정리를 도와줍니다.</p>
  </header>

  <main>
    <section id="about"></section>
    <section id="features"></section>
    <section id="steps"></section>
    <section id="subscribe"></section>
    <section id="list"></section>
  </main>

  <h2>서비스 소개</h2>
  <h3>생각을 메모하는 효과적인 서비스</h3>
  
  <footer>
    <small>ⓒ 2026 생각정리 서비스</small>
  </footer>
</body>

</html>
